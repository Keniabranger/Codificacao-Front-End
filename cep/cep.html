<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>formulario</title>
    </head>
    <body>
     <div>
     <h1>Cadastro e Endereço</h1>
      <form action="cep.html" method="post">
        <br>
        <label for="cep">Digite o cep:</label>
        <input type="number" id="cep" name="cep" required>
        <br>
        <label for="logradouro">logradouro:</label>
        <input type="text" id="logradouro" name="logradouro">
        <br>
        <label for="bairro">bairro:</label>
        <input type="text" id="bairro" name="bairro">
        <br>
        <label for="cidade">cidade:</label>
        <input type="cidade" id="cidade" name="cidade">
        <br>
        <label for="estado">estado:</label>
        <input type="estado" id="estado" name="estado">
        <br>
      </form>
     </div>
      <script>
        var campoCep = document.getElementById ('cep');
        campoCep.addEventListener ('blur', function(){
            var valorCep = campoCep.value
            fetch('https://viacep.com.br/ws/'+valorCep+'/json/')
            .then(res => res.json())
            .then(data => {
                console.log(data);
                document.getElementById('logradouro').value = data.logradouro;
                document.getElementById('bairro').value = data.bairro;
                document.getElementById('cidade').value = data.localidade;
                document.getElementById('estado').value = data.estado
                document.getElementById('cep').style.border = "solid green 24px"
            })
            .catch(erro => (
                document.getElementById('cep').style.border = "solid red 24px"
            ))
            .finally(() => {
                console.log('processo')
            })
        })
      </script>
    </body>
</html>
